
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Web GIS</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css">

    <style>
        html,
        body,
        #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js"></script>

    <script>
        /* Initial Map */
        var map = L.map('map').setView([-7.677567, 110.406899], 12);

        /* Tile Basemap */
        var basemap1 = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }
        );

        var basemap2 = L.tileLayer(
            'https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
            {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: 'Map data &copy; Google'
            }
        );

        /* Default Basemap */
        basemap1.addTo(map);

        /* Layer Marker */
        var marker1 = L.marker(
            [-7.766715, 110.377460],
            { draggable: true }
        ).addTo(map);

        marker1.bindPopup("Gedung B DIV-SIG UGM");

        var marker2 = L.marker(
            [-7.743168, 110.350276]
        ).addTo(map);

        marker2.bindPopup("RS Akademik UGM");

        /* Control Layer */
        var baseMaps = {
            "Esri Imagery": basemap1,
            "Google Street": basemap2
        };

        var overlayMaps = {
            "Gedung B DIV-SIG UGM": marker1,
            "RS Akademik UGM": marker2
        };

        L.control.layers(
            baseMaps,
            overlayMaps,
            { collapsed: false }
        ).addTo(map);

        /* Scale Bar */
        L.control.scale({
            maxWidth: 150,
            position: 'bottomright'
        }).addTo(map);

    </script>

</body>
</html>
